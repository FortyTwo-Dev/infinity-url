version: 2

updates:
  # The repository uses Bun, so Dependabot follows bun.lock through the `bun`
  # ecosystem, not `npm`.
  - package-ecosystem: bun
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    ignore:
      # vue-tsc resolves typescript/lib/tsc, which the TypeScript 7 line no
      # longer exports. Unblock when vue-tsc supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
