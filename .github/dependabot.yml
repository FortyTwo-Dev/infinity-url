version: 2

updates:
  # Le dépôt utilise Bun : Dependabot suit `bun.lock` via l'écosystème `bun`,
  # pas `npm`.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
      include: scope
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
